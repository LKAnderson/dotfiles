format = """
$directory\
$git_branch\
$git_status\
\n$character"""

[directory]
style = "blue"
format = "[$path]($style) "
truncation_length = 5
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "purple"
format = '[$symbol $branch]($style) '

[git_status]
style = "yellow"
format = '[($all_status$ahead_behind )]($style)'
